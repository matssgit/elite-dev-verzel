services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite_local
      POSTGRES_DB: elite
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
