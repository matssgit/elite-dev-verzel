name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elite
          POSTGRES_PASSWORD: elite_ci
          POSTGRES_DB: elite_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U elite -d elite_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://elite:elite_ci@localhost:5432/elite_test
      TEST_DATABASE_URL: postgres://elite:elite_ci@localhost:5432/elite_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
